name: Scheduled Dependency Audit

# Surfaces new vulnerability advisories on a schedule so the first red signal
# lands here instead of blocking an unrelated pull request. Handling steps are
# documented in docs/ci.md.

on:
  schedule:
    # Daily 09:30 Asia/Taipei (01:30 UTC).
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Audit all dependencies including development tooling
        run: npm run audit:full
      - name: Open or update the tracking issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Scheduled dependency audit is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `每日排程的 \`npm audit\` 在 main 上失敗：${runUrl}`,
              "",
              "處理流程見 `docs/ci.md` 的「依賴更新與 vulnerability audit」一節。",
              "在修補版本合併前，所有 PR 的 `dependency-audit` check 都會因同一公告失敗。",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependencies",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `仍然失敗：${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dependencies"],
              });
            }
