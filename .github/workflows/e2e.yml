name: Player E2E

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  player-main-flow:
    name: player-main-flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baccarat_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baccarat_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/baccarat_e2e
      DATABASE_SSL: "false"
      JWT_SECRET: e2e-only-not-used-outside-the-ephemeral-test-run
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare test database
        run: npm run db:migrate && npm run db:bootstrap && npm run db:seed
      - name: Run player main-flow E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
