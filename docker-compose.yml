services:
  postgres:
    image: postgres:16-alpine
    container_name: baccarat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: baccarat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Bind to loopback only: this dev database uses default credentials and
      # must not be reachable from other machines.
      - "127.0.0.1:5432:5432"
    volumes:
      - baccarat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baccarat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  baccarat-postgres-data:
